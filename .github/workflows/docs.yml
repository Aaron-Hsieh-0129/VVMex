# Build MkDocs and deploy to GitHub Pages.
name: Deploy documentation

on:
  push:
    branches: main
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "requirements-docs.in"
      - "requirements-docs.txt"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      # Pinned via requirements-docs.txt rather than a bare `pip install
      # mkdocs-material`. Material has announced that MkDocs 2.0 removes the
      # plugin system with no migration path, so a floating install would break
      # the published site without any change on our side.
      - name: Install MkDocs
        run: pip install --require-hashes -r requirements-docs.txt

      - name: Set site and repo URLs
        run: |
          python3 << 'PY'
          import pathlib
          import re

          path = pathlib.Path("mkdocs.yml")
          text = path.read_text()
          owner, repo = "${{ github.repository }}".split("/")
          site_url = f"https://{owner}.github.io/{repo}/"
          repo_url = f"https://github.com/{owner}/{repo}"
          text = re.sub(r"^site_url:.*$", f"site_url: {site_url}", text, flags=re.M)
          text = re.sub(r"^repo_url:.*$", f"repo_url: {repo_url}", text, flags=re.M)
          path.write_text(text)
          print("Auto-configured site_url:", site_url)
          PY

      - name: Build site
        run: mkdocs build

      # Keep the upload action pinned too: upload-pages-artifact's composite
      # action refers to upload-artifact through a movable tag.
      - name: Archive Pages artifact
        run: |
          if find site -type l -print -quit | grep -q .; then
            echo "::error::Pages artifact must not contain symlinks"
            exit 1
          fi
          tar --directory site --exclude=.git --exclude=.github \
            -cf "$RUNNER_TEMP/artifact.tar" .

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          if-no-files-found: error

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
