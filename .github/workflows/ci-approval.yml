# No PR checkout: decide whether a backend is enabled on GitHub-hosted compute.
name: CI run policy

on:
  workflow_call:
    inputs:
      runner_setting:
        description: Backend enable switch; unavailable on fork pull requests
        type: string
        required: false
        default: ''
    outputs:
      runner_enabled:
        description: Whether this run can proceed to self-hosted CI approval
        value: ${{ jobs.approval.outputs.runner_enabled }}

permissions:
  contents: read

jobs:
  approval:
    name: Determine CI approval
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      runner_enabled: ${{ steps.policy.outputs.runner_enabled }}
    steps:
      - name: Check backend policy
        id: policy
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          RUNNER_SETTING: ${{ inputs.runner_setting }}
        with:
          script: |
            core.setOutput('runner_enabled', 'false');
            const setting = (process.env.RUNNER_SETTING || '').trim();
            const pr = context.payload.pull_request;
            const dependabotPR = context.eventName === 'pull_request' &&
              pr?.user?.login === 'dependabot[bot]';
            const dependabotPush = context.eventName === 'push' &&
              (context.actor === 'dependabot[bot]' ||
               context.ref?.startsWith('refs/heads/dependabot/'));
            // Dependency updates use hosted checks. Keep manual dispatch and
            // scheduled tests available for deliberate model validation.
            if (dependabotPR || dependabotPush) {
              core.info('Dependabot update: skipping automatic self-hosted model tests.');
              return;
            }
            const baseRepository = `${context.repo.owner}/${context.repo.repo}`;
            const forkPR = context.eventName === 'pull_request' &&
              pr?.head?.repo?.full_name && pr.head.repo.full_name !== baseRepository;
            // GitHub withholds repository variables from fork PR workflows.
            // Let those runs reach the required-reviewer gate after GitHub's
            // fork-workflow approval instead of skipping them before review.
            const enabled = setting === 'true' || (setting === '' && forkPR);
            if (!enabled) {
              core.info('This CI backend is disabled; no self-hosted job will run.');
              return;
            }
            core.setOutput('runner_enabled', 'true');
            core.info('Backend enabled; owner approval is required before the self-hosted job starts.');
            if (setting === '' && forkPR) {
              core.info('Fork PR variables are unavailable; self-hosted CI can proceed after approval.');
            }
            // This output only enables the backend. Every self-hosted job
            // still requires the repository owner's environment approval.
